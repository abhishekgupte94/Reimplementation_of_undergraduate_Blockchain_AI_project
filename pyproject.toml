[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "room-surveillance-demo"
version = "0.1.0"
description = "Local Flask, Haar, OpenFace and SVC room-presence demonstration"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ChatterBot==1.2.15",
  "Flask==3.1.2",
  "Flask-Login==0.6.3",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-WTF==1.2.2",
  "SQLAlchemy==2.0.44",
  "PyMySQL[rsa]==1.1.2",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "Pillow==12.0.0",
  "python-dotenv==1.2.1",
  "filelock==3.20.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.setuptools.packages.find]
include = ["surveillance*"]

[tool.setuptools.package-data]
surveillance = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: requires a dedicated TEST_MYSQL_URL database", "model: requires downloaded OpenFace weights"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
